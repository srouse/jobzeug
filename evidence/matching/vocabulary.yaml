# Authoritative concept registry. Read engine.md and project-header-schema.md first.
# Approval here covers vocabulary definitions only, never claims about Scott.
schema_version: "1.0"
vocabulary_version: 1.0.0
title: Jobzeug project matching vocabulary
status: approved
created_at: 2026-09-26
review:
  reviewed_by: Codex
  reviewed_at: 2026-09-26
  scope: Agent-reviewed initial vocabulary definitions and mappings. Scott has not individually
    reviewed these concepts. Project annotations are reviewed separately in project headers; this file does not approve them.
purpose: Shared controlled concepts for project evidence and incoming job requirements; no fixed
  employer, posting, or project ranking.
categories:
  skill: A learned capability demonstrated through an action.
  knowledge: Subject-matter understanding, distinct from implementation.
  work_activity: An action performed in a project.
  work_context: Conditions under which work occurred.
  tool: A named technology, language, platform, or framework.
  domain: Local extension describing the product, industry, or audience setting.
  deliverable: Local extension describing an artifact or system produced.
  outcome: Local extension describing an observed result, requiring separate evidence.
external_source:
  system: O*NET
  release: "31.0"
  file: content_model_reference.json
  url: https://www.onetcenter.org/dl_files/database/db_31_0_json/content_model_reference.json
  sha256: 58f597d04b4bf1f457a4b50eaed67ddd120740df602acd404578acd78129e32e
  retrieved_at: 2026-09-26
  license_url: https://creativecommons.org/licenses/by/4.0/
  license_details_url: https://www.onetcenter.org/license_db.html
  attribution: Includes adapted information from the O*NET 31.0 Database by the U.S. Department of
    Labor, Employment and Training Administration (USDOL/ETA), used under CC BY 4.0. O*NET is a
    trademark of USDOL/ETA. Jobzeug has modified and added definitions and selected mappings;
    USDOL/ETA has not approved, endorsed, or tested these modifications.
  modifications: Local IDs, paraphrased definitions, selected external mappings, domain-specific
    extensions, evidence rules, and coverage checks. No occupation ratings imported.
rules:
  - Every ID is local. external_mappings identifies verified O*NET relationships; an empty mapping
    list means no external mapping asserted, not that no mapping could exist.
  - "Mapping relation is from the local concept to the external concept: narrower means the local
    concept is more specific. Related is not equivalence. External mappings do not confer match
    credit."
  - broader_ids organizes local concepts. Tag the most specific supported concept; do not sum parent
    and child matches for the same requirement.
  - Labels and aliases are case-insensitive lookup candidates, not automatic evidence. Short
    abbreviations require domain context.
  - basis.project_ids are vocabulary-discovery leads only. They do not assign tags to projects,
    prove competence, or resolve ownership and outcome uncertainty.
  - basis.requirement_source_ids document demand-side vocabulary checks. Requirements with no
    project lead are deliberately retained so gaps can be represented.
  - Scope, ownership, stage, dates, disclosure, and source reliability belong on claims and
    requirements, not in tag IDs.
  - No importance or proficiency weights belong here. Weights are specific to a posting; evidence
    match values are specific to a project-requirement pair.
  - Unknown requirements stay unmapped. Add concepts or aliases only through an explicit vocabulary
    revision, never during routine matching.
  - Approve or revise definitions separately from reviewing evidence annotations. Codex definition
    review does not imply Scott reviewed a concept or confirmed a claim.
  - Tools researched, mentioned in an article, or generated as output are not automatically tools
    personally implemented with.
  - Full job postings are not stored here. URLs and condensed category checks are provenance only,
    not career evidence.
