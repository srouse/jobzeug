coverage_checks:
  - source: J01
    requirement_summary: Implement accessible responsive interfaces
    concept_ids:
      - local:front-end-development
      - local:accessible-interface-development
      - local:responsive-interface-development
    constraint: All capabilities must be connected to the same work; production stage is a separate condition.
  - source: J02
    requirement_summary: Lead discovery and validate a customer proof of concept
    concept_ids:
      - local:technical-discovery
      - local:technical-prototype
      - local:software-testing
    constraint: Leadership, customer context, and agreed validation criteria require evidence; a demo
      alone is insufficient.
  - source: J03
    requirement_summary: Conduct research and usability testing to guide design
    concept_ids:
      - local:user-research
      - local:usability-testing
      - local:interaction-design
    constraint: Require user methods and resulting design decisions; no existing project assignment asserted.
known_unmapped_examples:
  - source: J02
    requirement: Specific CDP or cloud data warehouse expertise
    reason: Content modeling and Contentful use are not equivalents; add specific concepts when needed.
  - source: J02
    requirement: MEDDPICC or another named enterprise sales methodology
    reason: Sales contributions do not establish a specific methodology.
  - source: J01
    requirement: Conversational voice interfaces or real-time generative graphics
    reason: General interaction design and AI workflows do not establish these specialties.
limitations:
  - Initial coverage review uses 22 project records and three diverse postings; this is not an
    exhaustive occupational ontology or an evaluated ranking benchmark.
  - Project annotation and claim-level review are tracked in project headers and project-header-migration.md, separately from vocabulary approval.
  - No automatic synonym expansion, graph propagation, or project ranking is implemented by this
    data file.
